name: CI

# The collector runs as root on client production systems and hands its output
# to external auditors, so CI focuses on the two properties that matter most:
#   - it stays portable POSIX sh (it must run on Linux, AIX, Solaris, HP-UX)
#   - it never ships credential material in the evidence package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax and portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Parse under several shells. dash is the strictest common POSIX sh and
      # catches bashisms that would break on AIX ksh or Solaris /bin/sh.
      - name: Parse with sh, dash, and bash
        run: |
          for shell in sh dash bash; do
            printf '== %s -n ==\n' "$shell"
            "$shell" -n linux-unix-evidence-gathering-script.sh
          done
          for t in tests/*.sh tools/*.sh; do
            printf '== dash -n %s ==\n' "$t"
            dash -n "$t"
          done

      # A carriage return anywhere in these files survives into whatever is sent
      # to a client, where /bin/sh fails on it with errors that name lines which
      # look perfectly ordinary when opened. It is the most common way a working
      # script appears broken on arrival, and it is invisible in review, so it is
      # rejected here rather than left to be discovered on a production host.
      - name: Reject carriage returns
        run: |
          if git ls-files | xargs grep -lIU "$(printf '\r')" 2>/dev/null | grep . ; then
            echo "" >&2
            echo "The files above contain carriage returns (CRLF line endings)." >&2
            echo "They will fail on the client's host. Convert with:" >&2
            echo "    tr -d '\r' < FILE > FILE.new && mv FILE.new FILE" >&2
            exit 1
          fi
          echo "no carriage returns found"

      - name: Flag bashisms
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts
          checkbashisms linux-unix-evidence-gathering-script.sh tests/*.sh tools/*.sh

      - name: ShellCheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -s sh linux-unix-evidence-gathering-script.sh tests/*.sh tools/*.sh

      - name: Help and dry-run must not fail
        run: |
          sh linux-unix-evidence-gathering-script.sh --help >/dev/null
          sh linux-unix-evidence-gathering-script.sh --dry-run \
            --output-dir "$RUNNER_TEMP/dryrun" </dev/null >/dev/null
          test -s "$RUNNER_TEMP/dryrun/SOX-ITGC-AUDIT-LINUX-UNIX/report/SOX-ITGC-AUDIT-REPORT.txt"

      - name: Reject unknown options
        run: |
          if sh linux-unix-evidence-gathering-script.sh --not-a-real-flag >/dev/null 2>&1; then
            echo "expected a non-zero exit for an unknown option" >&2
            exit 1
          fi

  sensitive-paths:
    name: Sensitive-path classification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hermetic: checks AIX and HP-UX paths even though CI runs on Linux, so a
      # platform-specific hash store cannot regress unnoticed.
      - name: Assert credential stores are protected
        run: sh tests/test-sensitive-paths.sh

      # /etc/passwd must stay collectable, so it cannot be protected by path.
      # On a host that keeps hashes inline in field 2 - HP-UX without pwconv -
      # a content check is the only thing standing between the collector and a
      # credential leak through a file it is required to collect.
      - name: Assert inline /etc/passwd hashes are detected
        run: sh tests/test-inline-passwd-hashes.sh

  credential-leak:
    name: End-to-end credential leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plants sentinel credentials, runs a real collection as root, and fails
      # if anything sensitive reaches raw_files/ or the manifest overclaims.
      # Safe here because the runner is ephemeral and the test restores /etc.
      - name: Run collector and inspect the evidence package
        run: sudo sh tests/test-no-credential-leak.sh

  verify-package:
    name: Receipt verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Produces a real package, then damages copies of it in the ways a
      # delivery actually degrades, and requires the verifier to reject each.
      # A checker that only passes on good input gives false assurance.
      - name: Verify the verifier accepts good packages and rejects bad ones
        run: sudo sh tests/test-verify-package.sh

  multi-os-simulation:
    name: Multi-OS simulation (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [rhel, opensuse, aix, hpux]
    steps:
      - uses: actions/checkout@v4
      # Runs the collector against a themed chroot for each target OS. AIX and
      # HP-UX cannot boot on x86, so those fixtures simulate the file and
      # command layer to exercise their code paths - which is how the AIX
      # password-hash leak was found. See tests/simulations/README.md.
      - name: Simulate ${{ matrix.platform }} and verify the evidence package
        run: sudo sh tests/simulations/os_${{ matrix.platform }}.sh

      # The collector runs under umask 077 as root, so the evidence tree is
      # unreadable to the runner user and upload-artifact fails with EACCES.
      # Relax read permissions on the copy only; the fixture is already gone.
      - name: Make evidence readable for upload
        if: failure()
        run: sudo chmod -R a+rX /tmp/sox-itgc-sim/out || true

      - name: Upload evidence package on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}
          path: /tmp/sox-itgc-sim/out/${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: ignore
